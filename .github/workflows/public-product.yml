name: Public product validation
on:
  push:
    branches: [public/uid-cross-platform]
  pull_request:
    paths: ['account/**', 'backend/**', 'ios/**', 'scripts/**', 'tests/**', '*.js', 'package*.json', 'firestore.public.rules']
concurrency:
  group: meal-public-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  web-and-backend:
    if: github.event_name != 'pull_request' || github.head_ref != 'public/uid-cross-platform'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npm run test:accounts
      - run: npm run build:public
      - run: npm run test:public
  ios:
    if: github.event_name != 'pull_request' || github.head_ref != 'public/uid-cross-platform'
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build:public && node scripts/prepare-ios.mjs && python3 scripts/generate-ios-project.py
      - name: Select an available iPhone simulator
        run: |
          xcrun simctl list devices available --json > /tmp/meal-simulators.json
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          data=json.load(open('/tmp/meal-simulators.json'))
          phones=[d for devices in data['devices'].values() for d in devices if d['isAvailable'] and 'iPhone' in d['name']]
          if not phones: raise SystemExit('No iPhone simulator installed')
          print('MEAL_SIMULATOR='+phones[0]['udid'])
          PY
      - name: Start isolated native integration backend
        run: |
          node scripts/dev-proxy.mjs > /tmp/meal-ios-emulators.log 2>&1 &
          echo $! > /tmp/meal-ios-proxy.pid
          node --input-type=module <<'JS'
          let ready=false;
          for(let n=0;n<90;n++){
            try{const r=await fetch('http://127.0.0.1:4173/health');if((await r.json()).emulatorsReady){ready=true;break;}}catch{}
            await new Promise(r=>setTimeout(r,500));
          }
          if(!ready)throw new Error('Native integration backend did not start');
          JS
      - name: Build native app and tests
        timeout-minutes: 12
        run: xcodebuild -project ios/WeeklyMealPlanner.xcodeproj -scheme WeeklyMealPlanner -destination "platform=iOS Simulator,id=$MEAL_SIMULATOR" -derivedDataPath /tmp/meal-derived CODE_SIGNING_ALLOWED=NO MEAL_REQUIRE_INTEGRATION=YES build-for-testing
      - name: Boot native test simulator
        timeout-minutes: 3
        run: |
          xcrun simctl boot "$MEAL_SIMULATOR" || true
          xcrun simctl bootstatus "$MEAL_SIMULATOR" -b
      - name: Run native unit and integration tests
        timeout-minutes: 5
        run: xcodebuild -project ios/WeeklyMealPlanner.xcodeproj -scheme WeeklyMealPlanner -destination "platform=iOS Simulator,id=$MEAL_SIMULATOR" -destination-timeout 45 -derivedDataPath /tmp/meal-derived -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 90 -maximum-test-execution-time-allowance 120 CODE_SIGNING_ALLOWED=NO MEAL_REQUIRE_INTEGRATION=YES test-without-building
      - name: Stop native integration backend
        if: always()
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          if(fs.existsSync('/tmp/meal-ios-proxy.pid')){try{process.kill(Number(fs.readFileSync('/tmp/meal-ios-proxy.pid','utf8')),'SIGTERM');}catch{}}
          JS
